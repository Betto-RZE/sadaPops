version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sada_pops_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: mapa_dalias_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mapa_dalias_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: sada_pops_backend
    restart: always
    environment:
      ENV: development
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@postgres:5432/mapa_dalias_db
      CORS_ORIGINS: '["http://localhost:3000", "http://localhost:5173", "http://127.0.0.1:3000"]'
      LLM_API_KEY: dev_mock_key
      LLM_MODEL: gemini-1.5-flash
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
